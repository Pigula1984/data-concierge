# Evaluation set (plan U18, architecture section 13): prompts run through ask() on the real
# model and database. Each case names the expected status, the procedure calls with their model
# arguments (matched as a subset; unlisted arguments are not checked) and, for an `ok` answer,
# a reference query run in SQL Server. Results are compared by values, not column names.
# `today` defaults to 2025-07-01 (data covers 2022-05-30 to 2025-06-29).
# Run: uv run pytest -m eval tests/evals

# --- Lists with a filter ---------------------------------------------------------------------

- id: lista-berlin
  group: listy
  prompt: daj mi listę klientów z miejscowości Berlin
  expect:
    status: [ok]
    calls:
      - tool: customer_list
        args: {city: Berlin, country_region_code: null, customer_type: null}
    result:
      rule: contains
      sql: |
        SELECT DISTINCT v.CustomerName
        FROM api.vCustomer AS v
        JOIN Person.BusinessEntityAddress AS bea ON bea.BusinessEntityID = v.BusinessEntityID
        JOIN Person.Address AS a ON a.AddressID = bea.AddressID
        WHERE a.City = N'Berlin'

- id: sklepy-niemcy
  group: listy
  prompt: sklepy z Niemiec
  expect:
    status: [ok]
    calls:
      - tool: customer_list
        args: {city: null, country_region_code: DE, customer_type: store}
    result:
      rule: contains
      sql: |
        SELECT DISTINCT v.CustomerName
        FROM api.vCustomer AS v
        JOIN Person.BusinessEntityAddress AS bea ON bea.BusinessEntityID = v.BusinessEntityID
        JOIN Person.Address AS a ON a.AddressID = bea.AddressID
        JOIN Person.StateProvince AS sp ON sp.StateProvinceID = a.StateProvinceID
        WHERE sp.CountryRegionCode = 'DE' AND v.CustomerType = 'store'

- id: osoby-paryz
  group: listy
  prompt: osoby prywatne z Paryża
  expect:
    status: [ok]
    calls:
      - tool: customer_list
        args: {city: Paris, customer_type: individual}
    result:
      rule: contains
      sql: |
        SELECT DISTINCT v.CustomerName
        FROM api.vCustomer AS v
        JOIN Person.BusinessEntityAddress AS bea ON bea.BusinessEntityID = v.BusinessEntityID
        JOIN Person.Address AS a ON a.AddressID = bea.AddressID
        WHERE a.City = N'Paris' AND v.CustomerType = 'individual'

- id: klient-mohamed-pal
  group: listy
  prompt: pokaż klienta Mohamed Pal
  expect:
    # Three customers share the name: listing them or asking which one are both right.
    status: [ok, needs_clarification]
    calls:
      - tool: customer_search
        args: {name: Mohamed Pal}
    result:
      columns: [CustomerID]
      sql: |
        SELECT CustomerID FROM api.vCustomer WHERE CustomerName LIKE N'%Mohamed Pal%'

# --- Sales for a period ----------------------------------------------------------------------

- id: sprzedaz-q1-2025
  group: sprzedaż za okres
  prompt: sprzedaż za I kwartał 2025
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2025-01-01, date_to: 2025-04-01, customer_id: null}
    result:
      # The total as one row, or a monthly breakdown with the total in the comment.
      - rule: contains
        sql: |
          SELECT SUM(h.SubTotal) AS net_sales
          FROM Sales.SalesOrderHeader AS h
          JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
          WHERE h.OrderDate >= '2025-01-01' AND h.OrderDate < '2025-04-01'
      - rule: contains
        columns: [month, net_sales]
        sql: |
          SELECT DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1) AS month,
                 SUM(h.SubTotal) AS net_sales
          FROM Sales.SalesOrderHeader AS h
          JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
          WHERE h.OrderDate >= '2025-01-01' AND h.OrderDate < '2025-04-01'
          GROUP BY DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1)

- id: sprzedaz-2023
  group: sprzedaż za okres
  prompt: Jaka była łączna sprzedaż netto w 2023 roku?
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2023-01-01, date_to: 2024-01-01}
    result:
      # The total as one row, or a monthly breakdown with the total in the comment.
      - rule: contains
        sql: |
          SELECT SUM(h.SubTotal) AS net_sales
          FROM Sales.SalesOrderHeader AS h
          JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
          WHERE h.OrderDate >= '2023-01-01' AND h.OrderDate < '2024-01-01'
      - rule: contains
        columns: [month, net_sales]
        sql: |
          SELECT DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1) AS month,
                 SUM(h.SubTotal) AS net_sales
          FROM Sales.SalesOrderHeader AS h
          JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
          WHERE h.OrderDate >= '2023-01-01' AND h.OrderDate < '2024-01-01'
          GROUP BY DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1)

- id: terytoria-2024
  group: sprzedaż za okres
  prompt: sprzedaż w 2024 według terytoriów
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      sql: |
        SELECT t.Name AS territory, SUM(h.SubTotal) AS net_sales
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        JOIN Sales.SalesTerritory AS t ON t.TerritoryID = h.TerritoryID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
        GROUP BY t.Name

- id: top5-klientow-2024
  group: sprzedaż za okres
  prompt: 5 klientów z największą sprzedażą netto w 2024
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      ordered: true
      sql: |
        SELECT TOP 5 v.CustomerName, SUM(h.SubTotal) AS net_sales
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
        GROUP BY h.CustomerID, v.CustomerName
        ORDER BY net_sales DESC, h.CustomerID

- id: zamowienia-wg-typu-2024
  group: sprzedaż za okres
  prompt: ile zamówień w 2024 złożyli klienci indywidualni, a ile sklepy?
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      # Only the counts: the model may name the customer types in Polish.
      columns: [order_count]
      sql: |
        SELECT v.CustomerType, COUNT(*) AS order_count
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
        GROUP BY v.CustomerType

- id: srednia-zamowienia-2024
  group: sprzedaż za okres
  # No result check: avg is cast to DECIMAL(38,6) in DuckDB and rounds differently in SQL Server.
  prompt: jaka była średnia wartość zamówienia netto w 2024?
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}

