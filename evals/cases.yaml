- id: przelozony-bez-id
  group: trudne
  # No tool searches employees by name, so the model must ask for the id or decline.
  prompt: Kto jest przełożonym Kena Sáncheza?
  expect:
    status: [needs_clarification, unsupported]

- id: reklamacje
  group: trudne
  prompt: Pokaż klientów, którzy złożyli reklamację
  expect:
    status: [unsupported]

- id: stan-magazynowy
  group: trudne
  prompt: Jaki jest stan magazynowy produktu HL Fork?
  expect:
    status: [unsupported]

- id: obciety-wynik-produkty
  group: trudne
  # All order lines of the data range exceed max_rows, so a sum over one call would be partial.
  # Asking to narrow, declining, or narrowing calls whose sums add up are all right.
  prompt: Sprzedaż po produktach za cały okres danych
  expect:
    status: [needs_clarification, unsupported, ok]
    result:
      columns: [ProductName, net_sales]
      sql: |
        SELECT p.Name AS ProductName, SUM(d.LineTotal) AS net_sales
        FROM Sales.SalesOrderDetail AS d
        JOIN Sales.SalesOrderHeader AS h ON h.SalesOrderID = d.SalesOrderID
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        JOIN Production.Product AS p ON p.ProductID = d.ProductID
        GROUP BY p.Name
