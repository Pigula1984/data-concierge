# --- Reports over time and pivots ------------------------------------------------------------

- id: p3-raport-miesiace-2024
  group: raporty i pivoty
  prompt: raport sprzedaży po miesiącach za 2024
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01, customer_id: null}
    result:
      columns: [month, net_sales]
      sql: |
        SELECT DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1) AS month,
               SUM(h.SubTotal) AS net_sales
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
        GROUP BY DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1)

- id: kategorie-2024
  group: raporty i pivoty
  prompt: sprzedaż po kategoriach produktów w 2024
  expect:
    status: [ok]
    calls:
      - tool: sales_order_line_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01, customer_id: null, product_category_id: null}
    result:
      sql: |
        SELECT pc.Name AS category, SUM(d.LineTotal) AS net_sales
        FROM Sales.SalesOrderDetail AS d
        JOIN Sales.SalesOrderHeader AS h ON h.SalesOrderID = d.SalesOrderID
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        JOIN Production.Product AS p ON p.ProductID = d.ProductID
        JOIN Production.ProductSubcategory AS ps ON ps.ProductSubcategoryID = p.ProductSubcategoryID
        JOIN Production.ProductCategory AS pc ON pc.ProductCategoryID = ps.ProductCategoryID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
        GROUP BY pc.Name

- id: rowery-miesiace-2024
  group: raporty i pivoty
  prompt: sprzedaż rowerów po miesiącach w 2024
  expect:
    status: [ok]
    calls:
      - tool: sales_order_line_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01, customer_id: null, product_category_id: 1}
    result:
      columns: [month, net_sales]
      sql: |
        SELECT DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1) AS month,
               SUM(d.LineTotal) AS net_sales
        FROM Sales.SalesOrderDetail AS d
        JOIN Sales.SalesOrderHeader AS h ON h.SalesOrderID = d.SalesOrderID
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        JOIN Production.Product AS p ON p.ProductID = d.ProductID
        JOIN Production.ProductSubcategory AS ps ON ps.ProductSubcategoryID = p.ProductSubcategoryID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
          AND ps.ProductCategoryID = 1
        GROUP BY DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1)

- id: pivot-kwartaly-kategorie-2024
  group: raporty i pivoty
  prompt: tabela sprzedaży w 2024 - kwartały w wierszach, kategorie produktów w kolumnach
  expect:
    status: [ok]
    calls:
      - tool: sales_order_line_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      # The quarter label is the model's choice, so only the four category totals are compared.
      columns: [accessories, bikes, clothing, components]
      sql: |
        SELECT DATEPART(quarter, h.OrderDate) AS quarter,
               SUM(CASE WHEN pc.Name = N'Accessories' THEN d.LineTotal END) AS accessories,
               SUM(CASE WHEN pc.Name = N'Bikes' THEN d.LineTotal END) AS bikes,
               SUM(CASE WHEN pc.Name = N'Clothing' THEN d.LineTotal END) AS clothing,
               SUM(CASE WHEN pc.Name = N'Components' THEN d.LineTotal END) AS components
        FROM Sales.SalesOrderDetail AS d
        JOIN Sales.SalesOrderHeader AS h ON h.SalesOrderID = d.SalesOrderID
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        JOIN Production.Product AS p ON p.ProductID = d.ProductID
        JOIN Production.ProductSubcategory AS ps ON ps.ProductSubcategoryID = p.ProductSubcategoryID
        JOIN Production.ProductCategory AS pc ON pc.ProductCategoryID = ps.ProductCategoryID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
        GROUP BY DATEPART(quarter, h.OrderDate)

- id: sprzedaz-po-latach
  group: raporty i pivoty
  prompt: sprzedaż netto po latach za cały okres danych
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
    result:
      # Only the totals: the year may be a number or a date.
      columns: [net_sales]
      sql: |
        SELECT YEAR(h.OrderDate) AS year, SUM(h.SubTotal) AS net_sales
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        GROUP BY YEAR(h.OrderDate)

# --- Joining two sets (P5) -------------------------------------------------------------------

- id: p5-berlin-miesiace-2024
  group: łączenie zbiorów
  prompt: Sprzedaż po miesiącach w 2024 dla klientów z Berlina
  expect:
    status: [ok]
    calls:
      - tool: customer_list
        args: {city: Berlin}
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      rule: contains
      columns: [month, net_sales]
      sql: |
        SELECT DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1) AS month,
               SUM(h.SubTotal) AS net_sales
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
          AND h.CustomerID IN (
            SELECT c.CustomerID
            FROM api.vCustomer AS c
            JOIN Person.BusinessEntityAddress AS bea ON bea.BusinessEntityID = c.BusinessEntityID
            JOIN Person.Address AS a ON a.AddressID = bea.AddressID
            WHERE a.City = N'Berlin')
        GROUP BY DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1)

- id: sklepy-berlin-rowery-2024
  group: łączenie zbiorów
  prompt: Klienci typu sklep z Berlina, którzy w 2024 kupili rowery
  expect:
    status: [ok]
    calls:
      - tool: customer_list
        args: {city: Berlin}
      - tool: sales_order_line_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      # Exactly these stores: the store and bike filters are done in query.
      columns: [CustomerName]
      sql: |
        SELECT DISTINCT v.CustomerName
        FROM api.vCustomer AS v
        WHERE v.CustomerType = 'store'
          AND v.CustomerID IN (
            SELECT c.CustomerID
            FROM api.vCustomer AS c
            JOIN Person.BusinessEntityAddress AS bea ON bea.BusinessEntityID = c.BusinessEntityID
            JOIN Person.Address AS a ON a.AddressID = bea.AddressID
            WHERE a.City = N'Berlin')
          AND v.CustomerID IN (
            SELECT h.CustomerID
            FROM Sales.SalesOrderDetail AS d
            JOIN Sales.SalesOrderHeader AS h ON h.SalesOrderID = d.SalesOrderID
            JOIN Production.Product AS p ON p.ProductID = d.ProductID
            JOIN Production.ProductSubcategory AS ps
              ON ps.ProductSubcategoryID = p.ProductSubcategoryID
            WHERE ps.ProductCategoryID = 1
              AND h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01')

- id: klienci-berlin-sprzedaz-2024
  group: łączenie zbiorów
  prompt: którzy klienci z Berlina kupowali w 2024 i za ile netto?
  expect:
    status: [ok]
    calls:
      - tool: customer_list
        args: {city: Berlin}
      - tool: sales_order_list
        args: {date_from: 2024-01-01, date_to: 2025-01-01}
    result:
      columns: [CustomerName, net_sales]
      sql: |
        SELECT h.CustomerID, v.CustomerName, SUM(h.SubTotal) AS net_sales
        FROM Sales.SalesOrderHeader AS h
        JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
        WHERE h.OrderDate >= '2024-01-01' AND h.OrderDate < '2025-01-01'
          AND h.CustomerID IN (
            SELECT c.CustomerID
            FROM api.vCustomer AS c
            JOIN Person.BusinessEntityAddress AS bea ON bea.BusinessEntityID = c.BusinessEntityID
            JOIN Person.Address AS a ON a.AddressID = bea.AddressID
            WHERE a.City = N'Berlin')
        GROUP BY h.CustomerID, v.CustomerName

