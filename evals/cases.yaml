# --- Hard cases (architecture, sections 8 and 13) --------------------------------------------

- id: ostatni-kwartal-w-danych
  group: trudne
  prompt: Sprzedaż w ostatnim kwartale
  today: 2025-04-15
  expect:
    status: [ok]
    calls:
      - tool: sales_order_list
        args: {date_from: 2025-01-01, date_to: 2025-04-01}
    # The resolved period is shown to the user (plan U18).
    assumptions:
      - ["2025-01-01", "1 stycznia 2025", "01.01.2025", "I kwartał 2025", "Q1 2025"]
      - ["2025-03-31", "31 marca 2025", "31.03.2025", "2025-04-01", "I kwartał 2025", "Q1 2025"]
    result:
      - rule: contains
        sql: |
          SELECT SUM(h.SubTotal) AS net_sales
          FROM Sales.SalesOrderHeader AS h
          JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
          WHERE h.OrderDate >= '2025-01-01' AND h.OrderDate < '2025-04-01'
      - rule: contains
        columns: [month, net_sales]
        sql: |
          SELECT DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1) AS month,
                 SUM(h.SubTotal) AS net_sales
          FROM Sales.SalesOrderHeader AS h
          JOIN api.vCustomer AS v ON v.CustomerID = h.CustomerID
          WHERE h.OrderDate >= '2025-01-01' AND h.OrderDate < '2025-04-01'
          GROUP BY DATEFROMPARTS(YEAR(h.OrderDate), MONTH(h.OrderDate), 1)

