[project]
name = "data-concierge"
version = "0.1.0"
description = "AI assistant backend: turns a user prompt into stored procedure calls and deterministic results as JSON."
authors = [
    { name = "Marcin Pigłowski", email = "marcin.piglowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.0",
    "pydantic-ai-slim[anthropic]>=2.55",
    "pydantic-settings>=2.15.0",
    "pyodbc>=5.3.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
data-concierge = "data_concierge.api.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "PT",       # flake8-pytest-style
    "BLE",      # flake8-blind-except
    "RUF",      # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib mode: tests mirror the package, so basenames like test_service.py repeat across modules
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not integration and not eval"]
markers = [
    "integration: needs a local SQL Server with the deployed database (db/deploy.ps1)",
    "eval: calls the real Claude API and needs an Anthropic key",
]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
# Test files without __init__.py repeat basenames (test_service.py, conftest.py) across modules.
mypy_path = "src"
explicit_package_bases = true

# pyarrow ships neither inline types nor py.typed; its API is typed as Any.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# pyodbc is a single extension module; its pyodbc.pyi cannot be marked py.typed (PEP 561),
# so mypy does not read it and the API is typed as Any.
[[tool.mypy.overrides]]
module = ["pyodbc"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
