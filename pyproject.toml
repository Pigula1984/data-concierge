[project]
name = "data-concierge"
version = "0.1.0"
description = "AI assistant backend: turns a user prompt into stored procedure calls and deterministic results as JSON."
authors = [
    { name = "Marcin Pigłowski", email = "marcin.piglowski@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "RET",      # flake8-return
    "ARG",      # flake8-unused-arguments
    "PTH",      # flake8-use-pathlib
    "PT",       # flake8-pytest-style
    "BLE",      # flake8-blind-except
    "RUF",      # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.format]
docstring-code-format = true
